name: Release candidate

# ECLASS-11 — release gate.
#
# Runs only on release tags. The defining requirement: the critical E2E flow
# (teacher -> student -> review) must pass TWICE, consecutively, against the
# same build. Second run catches flakiness before release.

on:
  push:
    tags: ['v*']

env:
  NODE_VERSION: '20'
  DATABASE_URI: 'mongodb://mongo:27017/eclass-rc?replicaSet=rs0'
  PAYLOAD_SECRET: rc-ephemeral-secret-not-for-prod
  ALLOW_TEST_SEEDING: 'true'

jobs:
  release-e2e-twice:
    name: Critical E2E x2 (release gate)
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd 'mongosh --quiet --eval "db.runCommand({ping:1}).ok"'
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        env:
          MONGO_INITDB_DATABASE: eclass-rc
    steps:
      - uses: actions/checkout@v4

      - name: Initiate Mongo replica set
        run: |
          mongosh --quiet "mongodb://localhost:27017/eclass-rc" --eval '
            try { rs.status().ok } catch(e) { rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]}) };
            for (let i=0;i<30;i++){ if(db.runCommand({hello:1}).isWritablePrimary){print("primary ready");break} sleep(500) }
          '

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Critical E2E — run 1 of 2
        run: npm run test:e2e
        env:
          CI: 'true'

      - name: Critical E2E — run 2 of 2 (flakiness gate)
        run: npm run test:e2e
        env:
          CI: 'true'

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-rc
          path: |
            test-results/
            playwright-report/
