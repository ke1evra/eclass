name: Release candidate

# ECLASS-11 — release gate. Runs only on release tags. The critical E2E flow
# must pass TWICE, consecutively, against the same build (flakiness gate).

on:
  push:
    tags: ['v*']

env:
  NODE_VERSION: '20'
  DATABASE_URL: 'mongodb://127.0.0.1:27017/eclass-rc?replicaSet=rs0&directConnection=true'
  PAYLOAD_SECRET: rc-ephemeral-secret-not-for-prod
  ALLOW_TEST_SEEDING: 'true'

jobs:
  release-e2e-twice:
    name: Critical E2E x2 (release gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start MongoDB replica set (single node)
        run: |
          docker run -d --name mongo-rs \
            -p 27017:27017 \
            mongo:7 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            if docker exec mongo-rs mongosh --quiet --eval 'db.runCommand({ping:1}).ok' >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec mongo-rs mongosh --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})' || true
          for i in $(seq 1 60); do
            if docker exec mongo-rs mongosh --quiet --eval 'db.runCommand({hello:1}).isWritablePrimary' | grep -q true; then
              echo "PRIMARY READY"; break
            fi
            sleep 1
          done
          docker exec mongo-rs mongosh --quiet --eval 'db.runCommand({hello:1}).isWritablePrimary' | grep -q true || { echo "NOT PRIMARY"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Critical E2E — run 1 of 2
        run: npm run test:e2e
        env:
          CI: 'true'

      - name: Critical E2E — run 2 of 2 (flakiness gate)
        run: npm run test:e2e
        env:
          CI: 'true'

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-rc
          path: |
            test-results/
            playwright-report/
