name: CI

# ECLASS-11 / ECLASS-56 / ECLASS-61 — test pyramid, CI quality gates, MongoDB.
#
# Mongo runs as a replica set (required for transactions). GitHub Actions
# `services` cannot pass a custom `command` to the image, and Mongo 7 starts a
# standalone mongod by default — so we run the replset member ourselves via a
# `docker run` step and wait for a writable primary before any DB-dependent job.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  DATABASE_URL: 'mongodb://127.0.0.1:27017/eclass-ci?replicaSet=rs0&directConnection=true'
  PAYLOAD_SECRET: ci-ephemeral-secret-not-for-prod
  ALLOW_TEST_SEEDING: 'true'

jobs:
  quality:
    name: typecheck / lint / build / unit / audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start MongoDB replica set (single node)
        run: |
          docker run -d --name mongo-rs \
            -p 27017:27017 \
            mongo:7 --replSet rs0 --bind_ip_all
          # Wait for mongod to accept connections, then initiate the replset.
          for i in $(seq 1 30); do
            if docker exec mongo-rs mongosh --quiet --eval 'db.runCommand({ping:1}).ok' >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker exec mongo-rs mongosh --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})' || true
          # Wait until the node is a writable primary.
          for i in $(seq 1 60); do
            if docker exec mongo-rs mongosh --quiet --eval 'db.runCommand({hello:1}).isWritablePrimary' | grep -q true; then
              echo "PRIMARY READY"
              break
            fi
            sleep 1
          done
          docker exec mongo-rs mongosh --quiet --eval 'db.runCommand({hello:1}).isWritablePrimary' | grep -q true || { echo "NOT PRIMARY"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: Typecheck (production)
        run: npm run typecheck

      - name: Typecheck (tests)
        run: npm run typecheck:tests

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Unit + integration (with coverage gate)
        run: npm test -- --coverage

      - name: Cross-process restart proof (ECLASS-65)
        # The defining restart invariant: seed in process A (which exits), then
        # resolve in a FRESH process B against the same MongoDB. Proves the
        # session lives in the DB, not in memory. Uses a unique mktemp file
        # (0600 via the seeder) with a trap-based cleanup that runs on ANY exit.
        # The seeder prints ONLY the userId — the session token never reaches
        # stdout/logs.
        #
        # The seed output (stdout+stderr) is written DIRECTLY to a log file —
        # never tee'd raw into the GitHub Actions log. On failure, the file is
        # printed only AFTER scrubbing any long base64url-looking run, so a
        # future change that accidentally leaks a token cannot reach the logs.
        # Retry is gated on a CLASSIFIED transient Mongo error
        # (E11000/WriteConflict/TransientTransaction/catalog changes/IX lock)
        # — any other failure fails the step immediately, so a real defect is
        # never masked by a blanket retry.
        run: |
          set -euo pipefail
          SESSION_FILE=$(mktemp "$RUNNER_TEMP/eclass-restart-XXXXXX")
          SEED_LOG=$(mktemp "$RUNNER_TEMP/eclass-seed-XXXXXX.log")
          trap 'rm -f "$SESSION_FILE" "$SEED_LOG"' EXIT

          USER_ID=""
          for attempt in 1 2 3; do
            # Write output straight to the file; do NOT stream raw to the log.
            npx tsx scripts/restart-seed.ts "$SESSION_FILE" >"$SEED_LOG" 2>&1 || true
            USER_ID=$(grep '^SEEDED ' "$SEED_LOG" | awk '{print $2}' || true)
            if [ -n "$USER_ID" ]; then break; fi
            # Retry ONLY for a classified transient Mongo error; anything else
            # is a real defect — print the scrubbed log and fail immediately.
            if [ "$attempt" -lt 3 ] \
               && grep -qE "E11000|WriteConflict|TransientTransaction|catalog changes|IX lock" "$SEED_LOG"; then
              echo "::warning::restart-seed transient error on attempt $attempt. Scrubbed output:"
              sed -E 's/[A-Za-z0-9_-]{20,}/[REDACTED]/g' "$SEED_LOG"
              sleep $((attempt * 3))
              continue
            fi
            break
          done

          if [ -z "$USER_ID" ]; then
            echo "::error::restart-seed produced no SEEDED line. Scrubbed output:"
            sed -E 's/[A-Za-z0-9_-]{20,}/[REDACTED]/g' "$SEED_LOG"
            exit 1
          fi

          if [ -z "$USER_ID" ]; then
            echo "::error::restart-seed produced no SEEDED line after 3 attempts. Scrubbed output of the last attempt:"
            sed -E 's/[A-Za-z0-9_-]{20,}/[REDACTED]/g' "$SEED_LOG" || true
            exit 1
          fi
          npx tsx scripts/restart-resolve.ts "$SESSION_FILE" "$USER_ID"

      - name: Production dependency audit (0 high/critical)
        run: npm audit --omit=dev --audit-level=high

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/

  e2e:
    name: E2E acceptance + a11y (chromium)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Start MongoDB replica set (single node)
        run: |
          docker run -d --name mongo-rs \
            -p 27017:27017 \
            mongo:7 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            if docker exec mongo-rs mongosh --quiet --eval 'db.runCommand({ping:1}).ok' >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker exec mongo-rs mongosh --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})' || true
          for i in $(seq 1 60); do
            if docker exec mongo-rs mongosh --quiet --eval 'db.runCommand({hello:1}).isWritablePrimary' | grep -q true; then
              echo "PRIMARY READY"
              break
            fi
            sleep 1
          done
          docker exec mongo-rs mongosh --quiet --eval 'db.runCommand({hello:1}).isWritablePrimary' | grep -q true || { echo "NOT PRIMARY"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build (production) for stable E2E
        run: npm run build

      - name: Run acceptance suite (E2E + a11y)
        run: npm run test:e2e
        env:
          CI: 'true'

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: |
            test-results/
            playwright-report/
