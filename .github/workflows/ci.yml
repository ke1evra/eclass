name: CI

# ECLASS-11 / ECLASS-56 — test pyramid, CI quality gates, MongoDB persistence.
#
# Quality job: typecheck, lint, build, unit+integration (coverage gate), audit.
# E2E job: acceptance + a11y against a production build, MongoDB-backed.
#
# Persistence: MongoDB replica set (required for transactions, ECLASS-57).
# A single-node replset is enough for tests; production uses the server Mongo.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  # CI Mongo: a single-node replica set on the service container.
  DATABASE_URI: 'mongodb://mongo:27017/eclass-ci?replicaSet=rs0'
  PAYLOAD_SECRET: ci-ephemeral-secret-not-for-prod
  ALLOW_TEST_SEEDING: 'true'

jobs:
  quality:
    name: typecheck / lint / build / unit / audit
    runs-on: ubuntu-latest
    services:
      mongo:
        # mongo with --replset via the entrypoint args; healthcheck waits for
        # the replica set to become primary.
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd 'mongosh --quiet --eval "try { rs.status().ok } catch(e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}) }; db.runCommand({ping:1}).ok"'
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        env:
          MONGO_INITDB_DATABASE: eclass-ci
    steps:
      - uses: actions/checkout@v4

      - name: Initiate Mongo replica set
        run: |
          mongosh --quiet "mongodb://localhost:27017/eclass-ci" --eval '
            try { rs.status().ok } catch(e) { rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]}) };
            for (let i=0;i<30;i++){ if(db.runCommand({hello:1}).isWritablePrimary){print("primary ready");break} sleep(500) }
          '

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Unit + integration (with coverage gate)
        run: npm test -- --coverage

      - name: Production dependency audit (0 high/critical)
        run: npm audit --omit=dev --audit-level=high

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/

  e2e:
    name: E2E acceptance + a11y (chromium)
    runs-on: ubuntu-latest
    needs: quality
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd 'mongosh --quiet --eval "db.runCommand({ping:1}).ok"'
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        env:
          MONGO_INITDB_DATABASE: eclass-ci
    steps:
      - uses: actions/checkout@v4

      - name: Initiate Mongo replica set
        run: |
          mongosh --quiet "mongodb://localhost:27017/eclass-ci" --eval '
            try { rs.status().ok } catch(e) { rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]}) };
            for (let i=0;i<30;i++){ if(db.runCommand({hello:1}).isWritablePrimary){print("primary ready");break} sleep(500) }
          '

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build (production) for stable E2E
        run: npm run build

      - name: Run acceptance suite (E2E + a11y)
        run: npm run test:e2e
        env:
          CI: 'true'

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: |
            test-results/
            playwright-report/
